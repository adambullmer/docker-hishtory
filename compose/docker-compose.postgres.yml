# ==============================================================================
# hiSHtory Self-Hosted Stack - PostgreSQL Backend
# ==============================================================================
services:
  postgres:
    image: postgres:16-alpine
    container_name: hishtory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hishtory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hishtory_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-hishtory}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hishtory} -d ${POSTGRES_DB:-hishtory}"]
      interval: 10s
      timeout: 5s
      retries: 5

  hishtory:
    image: ghcr.io/${GH_IMAGE:-adambullmer/docker-hishtory}:latest
    container_name: hishtory-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - MODE=${MODE:-all}
      - HISHTORY_POSTGRES_DB=postgresql://${POSTGRES_USER:-hishtory}:${POSTGRES_PASSWORD:-hishtory_secure_password}@postgres:5432/${POSTGRES_DB:-hishtory}?sslmode=disable
      - HISHTORY_SECRET_KEY=${HISHTORY_SECRET_KEY:-}
      - WEB_USER=${WEB_USER:-admin}
      - WEB_PASSWORD=${WEB_PASSWORD:-}
      - WEB_PASSWORD_HASH=${WEB_PASSWORD_HASH:-}
    volumes:
      - ./config:/config
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pgdata:
    driver: local
