# ==============================================================================
# hiSHtory Self-Hosted Stack - Docker Secrets & Swarm Ready
# ==============================================================================
services:
  hishtory:
    image: ghcr.io/${GH_IMAGE:-ddworken/hishtory-server}:latest
    container_name: hishtory-server
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - MODE=all
      - HISHTORY_SECRET_KEY_FILE=/run/secrets/hishtory_secret_key
      - WEB_USER=admin
      - WEB_PASSWORD_FILE=/run/secrets/web_password
      # Or pre-hashed password:
      # - WEB_PASSWORD_HASH_FILE=/run/secrets/web_password_hash
    volumes:
      - ./config:/config
    secrets:
      - hishtory_secret_key
      - web_password
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3

secrets:
  hishtory_secret_key:
    file: ../secrets/hishtory_secret_key.txt
  web_password:
    file: ../secrets/web_password.txt
